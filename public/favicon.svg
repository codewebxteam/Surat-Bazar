<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Luxury Gold Linear Gradient -->
    <linearGradient id="sbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E7D2E" />
      <stop offset="20%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF5DE" />
      <stop offset="80%" stop-color="#C5A049" />
      <stop offset="100%" stop-color="#8A6820" />
    </linearGradient>

    <!-- Deep Royal Maroon Gradient -->
    <linearGradient id="sbMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E1622" />
      <stop offset="50%" stop-color="#3B0B14" />
      <stop offset="100%" stop-color="#20050A" />
    </linearGradient>

    <!-- Subtle Golden Glow Filter -->
    <filter id="sbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" floodColor="#D4AF37" floodOpacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Outer Royal Heritage Diamond / Medallion Ring -->
  <rect 
    x="8" 
    y="8" 
    width="84" 
    height="84" 
    rx="25" 
    transform="rotate(45 50 50)" 
    fill="#FAF7F2" 
    stroke="url(#sbGold)" 
    stroke-width="3" 
    stroke-dasharray="4.5 2.5"
  />

  <!-- 2. Inner Solid Crest Shield -->
  <rect 
    x="14" 
    y="14" 
    width="72" 
    height="72" 
    rx="20" 
    transform="rotate(45 50 50)" 
    fill="url(#sbMaroon)" 
    stroke="url(#sbGold)" 
    stroke-width="2.2" 
    filter="url(#sbGlow)"
  />

  <!-- 3. Royal Stylized 'S' Interlaced with Flowing Saree Drapes -->
  <g stroke="url(#sbGold)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Upper curve of the 'S' forming silk pleats -->
    <path 
      d="M 64 34 C 64 26, 42 24, 38 34 C 34 44, 66 48, 62 64 C 58 74, 36 72, 34 64" 
      stroke-width="4.2" 
    />

    <!-- Inner gold shimmer accent line -->
    <path 
      d="M 60 36 C 58 30, 44 28, 41 35 C 38 43, 62 48, 59 62 C 56 70, 40 68, 38 62" 
      stroke-width="1.8" 
      stroke-opacity="0.9" 
    />

    <!-- Traditional Handloom Shuttle Diamond at Center -->
    <path 
      d="M 50 44 L 54.5 50 L 50 55.5 L 45.5 50 Z" 
      fill="url(#sbGold)" 
      stroke-width="0.8" 
    />

    <!-- Top Royal Crown Lotus Crest -->
    <path 
      d="M 50 18 C 50 23, 53.5 26.5, 58 26.5 C 53.5 26.5, 50 30, 50 34.5 C 50 30, 46.5 26.5, 42 26.5 C 46.5 26.5, 50 23, 50 18 Z" 
      fill="url(#sbGold)" 
      stroke="none" 
    />
  </g>
</svg>